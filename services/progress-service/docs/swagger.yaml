basePath: /
definitions:
  dto.DailyLogMealRes:
    properties:
      calories:
        type: integer
      carbs_g:
        type: number
      fat_g:
        type: number
      id:
        type: string
      logged_at:
        type: string
      meal_type:
        type: string
      name:
        type: string
      protein_g:
        type: number
    type: object
  dto.DailyLogResponse:
    properties:
      exercise_minutes:
        type: integer
      id:
        type: string
      log_date:
        type: string
      meals:
        items:
          $ref: '#/definitions/dto.DailyLogMealRes'
        type: array
      mood:
        type: string
      notes:
        type: string
      sleep_hours:
        type: number
      user_id:
        type: string
      water_intake_ml:
        type: integer
    type: object
  dto.TrackingMetricResponse:
    properties:
      current_value:
        type: number
      deadline:
        type: string
      id:
        type: string
      metric_type:
        type: string
      status:
        type: string
      target_value:
        type: number
      user_id:
        type: string
    type: object
  repository.HabitLog:
    properties:
      completed:
        type: boolean
      createdAt:
        type: string
      habitName:
        type: string
      id:
        type: string
      loggedAt:
        type: string
      notes:
        type: string
      userId:
        type: string
    type: object
  repository.WeeklyProgressSummary:
    properties:
      createdAt:
        type: string
      endWeight:
        type: number
      habitsCompleted:
        type: integer
      habitsTotal:
        type: integer
      id:
        type: string
      startWeight:
        type: number
      summary:
        type: string
      userId:
        type: string
      weekEnd:
        type: string
      weekStart:
        type: string
      weightChange:
        type: number
    type: object
  repository.WeightLog:
    properties:
      createdAt:
        type: string
      id:
        type: string
      loggedAt:
        type: string
      notes:
        type: string
      userId:
        type: string
      weightKg:
        type: number
    type: object
  request.AddHabitRequest:
    properties:
      completed:
        type: boolean
      habitName:
        type: string
      notes:
        type: string
    type: object
  request.AddWeightRequest:
    properties:
      notes:
        type: string
      weightKg:
        type: number
    type: object
  response.ErrorResponse:
    properties:
      code:
        type: integer
      error:
        type: string
      message:
        type: string
      request_id:
        type: string
    type: object
  response.ProgressResponse:
    properties:
      dailyLogs:
        items:
          $ref: '#/definitions/dto.DailyLogResponse'
        type: array
      habitLogs:
        items:
          $ref: '#/definitions/repository.HabitLog'
        type: array
      trackingMetrics:
        items:
          $ref: '#/definitions/dto.TrackingMetricResponse'
        type: array
      weightLogs:
        items:
          $ref: '#/definitions/repository.WeightLog'
        type: array
    type: object
  response.SuccessResponse:
    properties:
      data: {}
      message:
        type: string
    type: object
host: localhost:8083
info:
  contact:
    email: support@dietician.local
    name: API Support
  description: This is the progress service for the dietician backend.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Progress Service API
  version: "1.0"
paths:
  /api/v1/progress/{userId}:
    get:
      consumes:
      - application/json
      description: Retrieve weight logs and habit logs for a specific user
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/response.ProgressResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get Progress History
      tags:
      - Progress
  /api/v1/progress/{userId}/habits:
    post:
      consumes:
      - application/json
      description: Add a new habit log entry for a specific user
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        type: string
      - description: Add Habit Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.AddHabitRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/repository.HabitLog'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add Habit Log
      tags:
      - Progress
  /api/v1/progress/{userId}/weekly-summary:
    get:
      consumes:
      - application/json
      description: Retrieve the weekly progress summary including weight changes and
        habit completion
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/repository.WeeklyProgressSummary'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get Weekly Summary
      tags:
      - Progress
  /api/v1/progress/{userId}/weight:
    post:
      consumes:
      - application/json
      description: Add a new weight log entry for a specific user
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        type: string
      - description: Add Weight Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.AddWeightRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/repository.WeightLog'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add Weight Log
      tags:
      - Progress
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
