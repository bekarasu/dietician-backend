basePath: /
definitions:
  request.AllergyInput:
    properties:
      allergy:
        type: string
      severity:
        type: string
    required:
    - allergy
    type: object
  request.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  request.OnboardingRequest:
    properties:
      activityLevel:
        type: string
      age:
        type: integer
      allergies:
        type: string
      dailyCalorieTarget:
        type: integer
      dietaryPreferences:
        items:
          type: string
        type: array
      dislikedFoods:
        type: string
      gender:
        type: string
      goalType:
        type: string
      heightCm:
        type: number
      name:
        type: string
      targetCoffeeCups:
        minimum: 0
        type: integer
      targetWaterMl:
        type: integer
      targetWeightKg:
        type: number
      weightKg:
        type: number
    required:
    - activityLevel
    - age
    - gender
    - goalType
    - heightCm
    - name
    - targetCoffeeCups
    - targetWaterMl
    - targetWeightKg
    - weightKg
    type: object
  request.RefreshRequest:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  request.RegisterRequest:
    properties:
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - firstName
    - lastName
    - password
    type: object
  request.UpdatePreferencesRequest:
    properties:
      allergies:
        items:
          $ref: '#/definitions/request.AllergyInput'
        type: array
      dislikedFoods:
        items:
          type: string
        type: array
      preferences:
        items:
          type: string
        type: array
    required:
    - dislikedFoods
    - preferences
    type: object
  request.UpdateProfileRequest:
    properties:
      activityLevel:
        type: string
      age:
        type: integer
      dailyCalorieTarget:
        type: integer
      dateOfBirth:
        type: string
      displayName:
        type: string
      gender:
        type: string
      goal:
        type: string
      heightCm:
        type: number
      targetCoffeeCups:
        type: integer
      targetWaterMl:
        type: integer
      targetWeightKg:
        type: number
    type: object
  request.UpdateWeightRequest:
    properties:
      weightKg:
        type: number
    required:
    - weightKg
    type: object
  request.VerifyOTPRequest:
    properties:
      otp:
        type: string
      otpToken:
        type: string
    required:
    - otp
    - otpToken
    type: object
  response.Allergy:
    properties:
      allergy:
        type: string
      createdAt:
        type: string
      id:
        type: string
      severity:
        type: string
    type: object
  response.AuthResponse:
    properties:
      accessToken:
        type: string
      refreshToken:
        type: string
    type: object
  response.DietaryPreference:
    properties:
      createdAt:
        type: string
      id:
        type: string
      preference:
        type: string
    type: object
  response.DislikedFood:
    properties:
      createdAt:
        type: string
      foodName:
        type: string
      id:
        type: string
    type: object
  response.ErrorResponse:
    properties:
      code:
        type: integer
      error:
        type: string
      message:
        type: string
      requestId:
        type: string
    type: object
  response.PreferencesResponse:
    properties:
      allergies:
        items:
          $ref: '#/definitions/response.Allergy'
        type: array
      dislikedFoods:
        items:
          $ref: '#/definitions/response.DislikedFood'
        type: array
      preferences:
        items:
          $ref: '#/definitions/response.DietaryPreference'
        type: array
    type: object
  response.RegisterResponse:
    properties:
      otpToken:
        type: string
    type: object
  response.SuccessResponse:
    properties:
      data: {}
      message:
        type: string
    type: object
  response.UserProfile:
    properties:
      activityLevel:
        type: string
      age:
        type: integer
      createdAt:
        type: string
      dailyCalorieTarget:
        type: integer
      dateOfBirth:
        type: string
      displayName:
        type: string
      gender:
        type: string
      goal:
        type: string
      heightCm:
        type: number
      id:
        type: string
      targetCoffeeCups:
        type: integer
      targetWaterMl:
        type: integer
      targetWeightKg:
        type: number
      updatedAt:
        type: string
      userId:
        type: string
      weightKg:
        type: number
    type: object
host: localhost:8080
info:
  contact:
    email: support@dietician.local
    name: API Support
  description: This is the account service for the dietician backend.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Account Service API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return tokens
      parameters:
      - description: Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/response.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Login
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Logout user and invalidate access/refresh tokens
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Refresh access token using refresh token
      parameters:
      - description: Refresh Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/response.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Refresh Token
      tags:
      - Auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user and send an OTP
      parameters:
      - description: Register Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.RegisterRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/response.RegisterResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Register a new user
      tags:
      - Auth
  /api/v1/auth/verify-otp:
    post:
      consumes:
      - application/json
      description: Verify OTP for a registered user
      parameters:
      - description: Verify OTP Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.VerifyOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/response.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Verify OTP
      tags:
      - Auth
  /api/v1/profiles:
    get:
      consumes:
      - application/json
      description: Retrieve the profile of the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/response.UserProfile'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get User Profile
      tags:
      - Profile
    put:
      consumes:
      - application/json
      description: Update or create the profile for the authenticated user
      parameters:
      - description: Update Profile Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/response.UserProfile'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update User Profile
      tags:
      - Profile
  /api/v1/profiles/onboarding:
    post:
      consumes:
      - application/json
      description: Sets up the user's profile and preferences in one step
      parameters:
      - description: Onboarding Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.OnboardingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/response.UserProfile'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Onboarding Profile Setup
      tags:
      - Profile
  /api/v1/profiles/preferences:
    get:
      consumes:
      - application/json
      description: Retrieve the preferences of the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/response.PreferencesResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get User Preferences
      tags:
      - Profile
    put:
      consumes:
      - application/json
      description: Update the preferences for the authenticated user
      parameters:
      - description: Update Preferences Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.UpdatePreferencesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/response.PreferencesResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update User Preferences
      tags:
      - Profile
  /api/v1/profiles/weight:
    put:
      consumes:
      - application/json
      description: Update only the weight for the authenticated user
      parameters:
      - description: Update Weight Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.UpdateWeightRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update User Weight
      tags:
      - Profile
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
