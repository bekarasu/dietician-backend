services:
  api-gateway:
    container_name: dietician-api-gateway
    build:
      context: .
      dockerfile: gateway/deployments/prod/Dockerfile
    ports:
      - "8080:8080"

  account-service:
    container_name: dietician-account-service
    build:
      context: .
      dockerfile: services/account-service/deployments/prod/Dockerfile
    ports:
      - "8081:8081"

  profile-service:
    container_name: dietician-profile-service
    build:
      context: .
      dockerfile: services/profile-service/deployments/prod/Dockerfile
    ports:
      - "8082:8082"

  progress-service:
    container_name: dietician-progress-service
    build:
      context: .
      dockerfile: services/progress-service/deployments/prod/Dockerfile
    ports:
      - "8083:8083"

  recommendation-service:
    container_name: dietician-recommendation-service
    build:
      context: .
      dockerfile: services/recommendation-service/deployments/prod/Dockerfile
    ports:
      - "8084:8084"

  medical-service:
    container_name: dietician-medical-service
    build:
      context: .
      dockerfile: services/medical-service/deployments/prod/Dockerfile
    ports:
      - "8085:8085"

