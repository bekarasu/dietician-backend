services:
  api-gateway:
    container_name: dietician-api-gateway
    build:
      context: .
      dockerfile: gateway/deployments/dev/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./:/app

  account-service:
    container_name: dietician-account-service
    build:
      context: .
      dockerfile: services/account-service/deployments/dev/Dockerfile
    ports:
      - "8081:8081"
    volumes:
      - ./:/app

  profile-service:
    container_name: dietician-profile-service
    build:
      context: .
      dockerfile: services/profile-service/deployments/dev/Dockerfile
    ports:
      - "8082:8082"
    volumes:
      - ./:/app

  progress-service:
    container_name: dietician-progress-service
    build:
      context: .
      dockerfile: services/progress-service/deployments/dev/Dockerfile
    ports:
      - "8083:8083"
    volumes:
      - ./:/app

  recommendation-service:
    container_name: dietician-recommendation-service
    build:
      context: .
      dockerfile: services/recommendation-service/deployments/dev/Dockerfile
    ports:
      - "8084:8084"
    volumes:
      - ./:/app

  medical-service:
    container_name: dietician-medical-service
    build:
      context: .
      dockerfile: services/medical-service/deployments/dev/Dockerfile
    ports:
      - "8085:8085"
    volumes:
      - ./:/app

  tracking-service:
    container_name: dietician-tracking-service
    build:
      context: .
      dockerfile: services/tracking-service/deployments/dev/Dockerfile
    ports:
      - "8086:8086"
    volumes:
      - ./:/app
